name: TimeLedger
options:
  bundleIdPrefix: com.trimngo
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  xcodeVersion: '26.3'
  developmentLanguage: en
packages:
  LedgerCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: $(LEDGER_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LEDGER_CLOUD_ENABLED: NO
    LEDGER_CLOUD_CONTAINER: iCloud.com.trimngo.TimeLedger
targets:
  TimeLedger:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: SiriResources
        buildPhase: resources
    dependencies:
      - package: LedgerCore
      - target: TimeLedgerWatch
        embed: true
      - target: TimeLedgerTimerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trimngo.TimeLedger
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(LEDGER_IOS_PROFILE_NAME)
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Dash
        CFBundleSpokenName: Dash
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        INIntentsSupported: [INCreateNoteIntent]
        NSSiriUsageDescription: Save ideas and log current activities in Dash using Siri.
        NSHealthShareUsageDescription: Dash reads Time in Daylight to show your recorded daylight exposure and previous-week average. Health data is not added to activity logs or app backups.
        NSHealthUpdateUsageDescription: Dash uses HealthKit only to read your recorded Time in Daylight. Dash does not save or change health data.
        NSCalendarsFullAccessUsageDescription: Dash reads selected calendars to suggest ended events for your confirmation. Only confirmed events become logged time. Your calendars are never modified.
        NSCalendarsUsageDescription: Dash reads selected calendar events so you can confirm whether they happened.
        NSRemindersFullAccessUsageDescription: Dash transfers unfinished reminders from your chosen capture list into your idea inbox, deleting originals only after saving them. It can create a Dash Inbox list when you ask.
        NSRemindersUsageDescription: Dash transfers ideas from your selected Reminders list, removing originals after saving them.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.trimngo.TimeLedger.reminders-refresh, com.trimngo.TimeLedger.checkins-refresh, com.trimngo.TimeLedger.calendar-refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: Dash schedules timer alarms with task names and Restart controls. Your Watch can also run its own independent alarm.
        CFBundleURLTypes:
          - CFBundleURLName: com.trimngo.TimeLedger.timers
            CFBundleURLSchemes: [canal-dash]
        LedgerCloudEnabled: $(LEDGER_CLOUD_ENABLED)
        LedgerCloudContainer: $(LEDGER_CLOUD_CONTAINER)
        NSUbiquitousContainers:
          iCloud.com.trimngo.TimeLedger:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Ledger
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Generated/iOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [$(LEDGER_CLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit, CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [$(LEDGER_CLOUD_CONTAINER)]
        com.apple.developer.siri: true
        com.apple.developer.healthkit: true
  TimeLedgerWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
      - path: SiriResources
        buildPhase: resources
    dependencies:
      - package: LedgerCore
      - target: TimeLedgerWatchIntents
        embed: true
      - target: TimeLedgerWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trimngo.TimeLedger.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(LEDGER_WATCH_PROFILE_NAME)
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Dash
        CFBundleSpokenName: Dash
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.trimngo.TimeLedger
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [alarm]
        CFBundleURLTypes:
          - CFBundleURLName: com.trimngo.TimeLedger.watchkitapp.quick-log
            CFBundleURLSchemes: [canal-dash]
        INIntentsSupported: [INCreateNoteIntent]
        NSSiriUsageDescription: Save ideas and log current activities in Dash using Siri.
        ITSAppUsesNonExemptEncryption: false
        LedgerCloudEnabled: $(LEDGER_CLOUD_ENABLED)
        LedgerCloudContainer: $(LEDGER_CLOUD_CONTAINER)
        LedgerCaptureAccessGroup: $(AppIdentifierPrefix)com.trimngo.TimeLedger.watchkitapp
    entitlements:
      path: Generated/Watch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [$(LEDGER_CLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.siri: true
        keychain-access-groups: [$(AppIdentifierPrefix)com.trimngo.TimeLedger.watchkitapp]
  TimeLedgerWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
      - path: Shared/TimerWidgetStore.swift
    dependencies:
      - package: LedgerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trimngo.TimeLedger.watchkitapp.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(LEDGER_WATCH_WIDGETS_PROFILE_NAME)
    info:
      path: Generated/WatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Dash Log
        LedgerCaptureAccessGroup: $(AppIdentifierPrefix)com.trimngo.TimeLedger.watchkitapp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/WatchWidgets.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.trimngo.TimeLedger.watchkitapp]
  TimeLedgerTimerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TimerWidgets
      - path: Shared/TimerLiveAttributes.swift
      - path: Shared/RestartTimerIntent.swift
      - path: Shared/SilenceTimerAlarmIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trimngo.TimeLedger.timerwidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LEDGER_WIDGETS_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(LEDGER_TIMER_WIDGETS_PROFILE_NAME)
    info:
      path: Generated/TimerWidgets-Info.plist
      properties:
        CFBundleDisplayName: Dash Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TimeLedgerWatchIntents:
    type: app-extension
    platform: watchOS
    sources:
      - WatchIntents
      - path: Shared/SiriCaptureHandler.swift
      - path: Shared/SiriCaptureQueue.swift
      - path: SiriResources
        buildPhase: resources
    dependencies:
      - package: LedgerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trimngo.TimeLedger.watchkitapp.capture
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LEDGER_INTENTS_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(LEDGER_WATCH_INTENTS_PROFILE_NAME)
    info:
      path: Generated/WatchIntents-Info.plist
      properties:
        CFBundleDisplayName: Dash Capture
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LedgerCaptureAccessGroup: $(AppIdentifierPrefix)com.trimngo.TimeLedger.watchkitapp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
          NSExtensionAttributes:
            IntentsSupported: [INCreateNoteIntent]
            IntentsRestrictedWhileLocked: []
    entitlements:
      path: Generated/WatchIntents.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.trimngo.TimeLedger.watchkitapp]
  TimeLedgerWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [WatchTests]
    dependencies:
      - target: TimeLedgerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trimngo.TimeLedger.watchkitapp.UITests
        GENERATE_INFOPLIST_FILE: YES
  TimeLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TimeLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trimngo.TimeLedger.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TimeLedger:
    build:
      targets:
        TimeLedger: all
        TimeLedgerWatch: all
    test:
      targets: [TimeLedgerUITests]
    archive:
      config: Release
  TimeLedgerWatch:
    build:
      targets:
        TimeLedgerWatch: all
    test:
      targets: [TimeLedgerWatchUITests]
