name: Review history screens
on:
  push:
    branches: [feat/native-history-backup-inbox]
    paths: [.github/workflows/history-debug.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38805750238
          name: native-simulator-results
          path: results
      - name: Export app screenshots
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcrun xcresulttool export attachments --path results/UITests.xcresult --output-path attachments
          python3 - <<'PY'
          from pathlib import Path
          import shutil, json
          Path('review').mkdir()
          for test in json.loads(Path('attachments/manifest.json').read_text()):
              for item in test['attachments']:
                  name = item.get('suggestedHumanReadableName', '')
                  if name.startswith('Review-'):
                      shutil.copyfile(Path('attachments') / item['exportedFileName'], Path('review') / Path(name).name)
                      print(name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: history-screen-review
          path: review/**
          retention-days: 1
