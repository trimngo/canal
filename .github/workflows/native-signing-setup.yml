name: Apple signing setup guide
on:
  workflow_dispatch:
permissions: {}
jobs:
  guide:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Manual setup instructions
        run: |
          echo 'Create the signing identity on your Mac and paste the encrypted bundle into the apple-testflight environment secret APPLE_DISTRIBUTION_P12_BASE64. Use the password already saved as APPLE_DISTRIBUTION_P12_PASSWORD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Instructions: https://github.com/trimngo/canal/blob/main/native/README.md#manual-signing-on-your-mac' >> "$GITHUB_STEP_SUMMARY"
          echo 'This guide does not access Apple credentials, create certificates, or publish signing files. No additional GitHub access token is required.' >> "$GITHUB_STEP_SUMMARY"
