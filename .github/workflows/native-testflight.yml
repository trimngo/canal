name: Native TestFlight delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Test/CI/documentation changes do not change the installed application.
    # workflow_dispatch remains available for an intentional signing rebuild.
    paths:
      - 'native/**'
      - '!native/docs/**'
      - '!native/README.md'
      - '!native/Tests/**'
      - '!native/WatchTests/**'
      - '!native/TestsPython/**'
      - '!native/Core/Tests/**'
      - '!native/scripts/**'
permissions:
  contents: read
concurrency:
  group: native-testflight
  # Finish processing/distribution even if another main commit arrives.
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/main' && vars.APPLE_SIGNING_READY == 'true'
    runs-on: macos-15
    environment: apple-testflight
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: native
      - name: Build and deliver to TestFlight
        working-directory: native
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'M3ZCVUVHFT' }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          LEDGER_CLOUD_ENABLED: ${{ vars.LEDGER_CLOUD_ENABLED || 'NO' }}
          LEDGER_CLOUD_CONTAINER: ${{ vars.LEDGER_CLOUD_CONTAINER || 'iCloud.com.trimngo.TimeLedger' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
