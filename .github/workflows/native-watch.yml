name: Native Watch UI checks
on:
  workflow_call:
    inputs:
      focus:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      focus:
        description: Run the five timer paging and queue regressions only
        type: boolean
        default: false
        required: false
  push:
    branches: ['ci/watch-*']
    paths: ['native/**', '.github/workflows/native-watch.yml']
permissions:
  contents: read
concurrency:
  group: native-watch-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  watch-ui:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Test Watch UI
        timeout-minutes: 35
        env:
          WATCH_FOCUS: ${{ inputs.focus || startsWith(github.ref_name, 'ci/watch-') }}
        run: |
          mkdir -p native/build
          set -o pipefail
          selection=()
          if [[ "$WATCH_FOCUS" == "true" ]]; then
            for test in \
              testFullTaskTitleWrapsWhileWaitingRunningAndPaused \
              testMainTimerRowsOpenSystemInputWithoutAQueueSheetAndUseFiveMinutes \
              testQueueCanDeleteAnyTimerAndDeletingCurrentWaitsForStart \
              testQueueShowsThreeTimersAndTouchScrollingReachesMoreWithoutChangingPages \
              testUpcomingRowsCanBeDraggedWithoutMovingCurrentOrNavigatingAway; do
              selection+=("-only-testing:TimeLedgerWatchUITests/WatchQuickLogUITests/$test")
            done
          fi
          bash native/scripts/test-watch-ui.sh "${selection[@]}" 2>&1 | tee native/build/watch-validation.log
      - name: Export Watch interface review
        if: ${{ !cancelled() }}
        run: |
          if [ -f native/build/WatchUITests.xcresult/Info.plist ]; then
            mkdir -p native/build/watch-ui-review
            xcrun xcresulttool get test-results summary --path native/build/WatchUITests.xcresult > native/build/watch-ui-review/summary.json
            xcrun xcresulttool export attachments --path native/build/WatchUITests.xcresult --output-path native/build/watch-ui-attachments
            python3 native/scripts/export-ui-review.py native/build/watch-ui-attachments native/build/watch-ui-review
          elif [ -d native/build/WatchUITests.xcresult ]; then
            echo '::warning::Watch result bundle was interrupted before completion; see watch-validation.log.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-watch-ui-review
          path: |
            native/build/watch-ui-review
            native/build/watch-validation.log
          retention-days: 7
