name: Deletion and input screen review
on:
  push:
    branches: ['review/native-delete-input']
permissions:
  contents: read
  actions: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0; attempt<40; attempt++) {
              const response=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:38860410258});
              if (response.data.artifacts.some(a=>a.name==='native-simulator-results')) return;
              const run=await github.rest.actions.getWorkflowRun({...context.repo,run_id:38860410258});
              if (run.data.status==='completed') throw new Error('Run completed without a results artifact');
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw new Error('Test artifact not available');
      - uses: actions/download-artifact@v4
        with:
          name: native-simulator-results
          run-id: 38860410258
          github-token: ${{ github.token }}
          path: results
      - name: Export screenshots and diagnostic summaries
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          RESULT=$(find results -name UITests.xcresult -type d -print -quit)
          mkdir -p review
          if [ -z "$RESULT" ]; then exit 0; fi
          xcrun xcresulttool get test-results summary --path "$RESULT" > review/summary.json
          xcrun xcresulttool export attachments --path "$RESULT" --output-path attachments
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('attachments')
          manifest=json.loads((root/'manifest.json').read_text())
          shutil.copy(root/'manifest.json','review/manifest.json')
          for test in manifest:
              items=test.get('attachments',[])
              for a in items:
                  name=a.get('suggestedHumanReadableName','')
                  if name.startswith('Review-'):
                      shutil.copy(root/a['exportedFileName'],pathlib.Path('review')/(pathlib.Path(name).stem+'.png'))
              snaps=sorted([a for a in items if 'UI Snapshot' in a.get('suggestedHumanReadableName','')],key=lambda a:a.get('timestamp',0),reverse=True)[:1]
              for a in snaps:
                  shutil.copy(root/a['exportedFileName'],pathlib.Path('review')/('diagnostic-'+a['exportedFileName']+'.plist'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deletion-screen-review
          path: review
          retention-days: 1
