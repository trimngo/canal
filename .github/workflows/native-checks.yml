name: Native Apple checks
on:
  push:
    branches: ['feat/native-short-siri-timer-verify']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Build iPhone and Watch and validate Siri metadata
        env:
          LEDGER_UI_TESTS: '0'
        run: bash native/scripts/validate.sh
