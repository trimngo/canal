name: Native Apple checks
on:
  pull_request:
    paths: ['native/**', '.github/workflows/native-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  watch-ui:
    uses: ./.github/workflows/native-watch.yml
    with:
      focus: false
  build:
    runs-on: macos-15
    # Four phone shards plus Watch fit the observed five-Mac concurrency.
    # Keep every UI test; extra shards create a second simulator-boot wave.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Validate signing automation syntax
        run: |
          ruby -c native/fastlane/Fastfile
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("native/scripts/create-signing-certificate.py").read_text())'
      - name: Test core and build iPhone and Watch apps
        # Cold simulator startup has taken 11 minutes before tests begin.
        timeout-minutes: 50
        env:
          LEDGER_UI_TESTS: '1'
          LEDGER_UI_TEST_SHARD: ${{ matrix.shard }}
          LEDGER_UI_TEST_SHARDS: '4'
        run: |
          mkdir -p native/build
          set -o pipefail
          bash native/scripts/validate.sh 2>&1 | tee native/build/validation.log
      - name: Export compact interface review
        if: ${{ !cancelled() }}
        run: |
          if [ -f native/build/UITests.xcresult/Info.plist ]; then
            mkdir -p native/build/ui-review
            xcrun xcresulttool get test-results summary --path native/build/UITests.xcresult > native/build/ui-review/summary.json
            xcrun xcresulttool export attachments --path native/build/UITests.xcresult --output-path native/build/ui-attachments
            python3 native/scripts/export-ui-review.py native/build/ui-attachments native/build/ui-review
          elif [ -d native/build/UITests.xcresult ]; then
            echo '::warning::UI result bundle was interrupted before completion; see validation.log.'
          fi
      - name: Save interface screenshots and summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-review-${{ matrix.shard }}
          path: native/build/ui-review
          retention-days: 7
      - name: Save simulator apps and test results
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: native-simulator-results-${{ matrix.shard }}
          path: |
            native/build/Build/Products/Debug-iphonesimulator/*.app
            native/build/Build/Products/Debug-watchsimulator/*.app
            native/build/UITests.xcresult
            native/build/validation.log
          retention-days: 7
      - name: Save validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-log-${{ matrix.shard }}
          path: native/build/validation.log
          retention-days: 7
