name: Native Apple checks
on:
  push:
    branches: ['feat/native-watch-timer-*']
    paths: ['native/**', '.github/workflows/native-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  watch-ui:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        env: { HOMEBREW_NO_AUTO_UPDATE: '1' }
        run: brew install xcodegen
      - name: Test Watch rows, native system input, defaults and log capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("native/scripts/test-watch-ui.sh").read_text()
          filters = " -only-testing:TimeLedgerWatchUITests/WatchQuickLogUITests/testTimerExpiryHasDirectDoneAndRestartAndKeepsQueueAfterRelaunch -only-testing:TimeLedgerWatchUITests/WatchQuickLogUITests/testMainTimerRowsOpenSystemInputWithoutAQueueSheetAndUseFiveMinutes -only-testing:TimeLedgerWatchUITests/WatchQuickLogUITests/testWatchHomeCanAddATimerInOneTap"
          source = source.replace("-parallel-testing-enabled NO test", "-parallel-testing-enabled NO" + filters + " test")
          source = source.replace('xcrun simctl bootstatus "$PHONE_DEVICE_ID" -b', 'xcrun simctl bootstatus "$PHONE_DEVICE_ID" -b\nxcrun simctl boot "$WATCH_DEVICE_ID" || true\nxcrun simctl bootstatus "$WATCH_DEVICE_ID" -b')
          Path("native/scripts/.timer-watch-validation.sh").write_text(source)
          PY
          bash native/scripts/.timer-watch-validation.sh
      - name: Export Watch timer review
        if: always()
        run: |
          if [ -f native/build/WatchUITests.xcresult/Info.plist ]; then
            mkdir -p native/build/timer-watch-review
            xcrun xcresulttool get test-results summary --path native/build/WatchUITests.xcresult > native/build/timer-watch-review/summary.json
            xcrun xcresulttool export attachments --path native/build/WatchUITests.xcresult --output-path native/build/timer-watch-attachments
            python3 native/scripts/export-ui-review.py native/build/timer-watch-attachments native/build/timer-watch-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: timer-watch-review, path: native/build/timer-watch-review, retention-days: 7 }
