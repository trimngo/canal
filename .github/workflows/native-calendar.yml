name: Native calendar preview and categorization checks
on:
  push:
    branches: ['ci/calendar-*']
    paths: ['native/**', '.github/workflows/native-calendar.yml']
permissions:
  contents: read
concurrency:
  group: native-calendar-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  calendar:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Test core, both app builds, and calendar categorization
        timeout-minutes: 35
        run: |
          mkdir -p native/build
          set -o pipefail
          LEDGER_UI_TESTS=1 bash native/scripts/validate.sh \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testCalendarPlanSeparatesRecordedAndPlannedCategories \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testCalendarPlanPieIsTentativeAndHistoryRemainsRecordedAfterRelaunch \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testCalendarPlanDeselectingSourceRemovesForecastWithoutChangingRecords \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testCalendarReviewUsesPhraseRulesAndKeepsCategoriesAfterRelaunch \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testCalendarReviewUsesLearnedMatchesFromConfirmedLogs \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testCalendarUncategorizedChoiceSurvivesLateMatchAndEditedTitle \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testCalendarConfirmationRecordsFullPeriodAndUpdatesGoal \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testRandomNotificationsQueueAndSwitchBackToRepeating \
            2>&1 | tee native/build/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-categorization-validation
          path: |
            native/build/validation.log
            native/build/UITests.xcresult
          retention-days: 7
