name: Focused input checks superseded by full validation
on:
  push:
    branches: ['ci/calendar-input-setup']
    paths: ['.github/workflows/native-calendar.yml']
permissions:
  contents: read
concurrency:
  group: native-calendar-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Use the complete release validation
        run: echo 'No focused test result is claimed. Complete source validation runs at https://github.com/trimngo/canal/actions/runs/40947104076; its full suite includes all five focused cases.'
