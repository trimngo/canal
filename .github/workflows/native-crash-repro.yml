name: Native Watch restart reproduction
on:
  push:
    branches: ['ci/crash-repro-*']
    paths: ['native/**', '.github/workflows/native-crash-repro.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Build both apps and reproduce Watch restart receipt
        timeout-minutes: 35
        run: |
          mkdir -p native/build
          set -o pipefail
          LEDGER_UI_TESTS=1 bash native/scripts/validate.sh \
            -only-testing:TimeLedgerUITests/WatchRestartReceiptUITests/testWatchOwnedRestartReceiptSurvivesDuplicatesAndPhoneRelaunch \
            2>&1 | tee native/build/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-restart-reproduction
          path: |
            native/build/validation.log
            native/build/UITests.xcresult
          retention-days: 7
