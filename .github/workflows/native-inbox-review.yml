name: iPhone category review stability checks
on:
  push:
    branches: ['ci/inbox-review-regression']
    paths: ['.github/workflows/native-inbox-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Repeat the unchanged Inbox review flow five times
        timeout-minutes: 45
        run: |
          mkdir -p native/build
          set -o pipefail
          LEDGER_UI_TESTS=1 bash native/scripts/validate.sh \
            -test-iterations 5 \
            -only-testing:TimeLedgerUITests/TimeLedgerUITests/testIdeaCategorizationHasInlineDetailsDoneDeleteAndUndo \
            2>&1 | tee native/build/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-review-stability
          path: |
            native/build/validation.log
            native/build/UITests.xcresult
          retention-days: 7
